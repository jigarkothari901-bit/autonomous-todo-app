<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Tasks</h1>
      <p class="subtitle">Stay organized, focused, and productive.</p>
    </header>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit" id="add-btn">Add</button>
    </form>
    <div class="toolbar">
      <span id="task-count">0 tasks left</span>
      <button id="clear-completed" class="btn-text">Clear Completed</button>
    </div>
    <ul id="todo-list" class="todo-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
